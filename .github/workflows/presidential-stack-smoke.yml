name: Presidential Simulator integration smoke test

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "index.html"
      - ".github/workflows/presidential-stack-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify published pages, CORS and Telegram signature gate
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const api = "https://br-little-union-b9iipjfz-nettleapi.compute.c-7.eu-central-1.aws.neon.tech";
          const gameOrigin = "https://merekwi.github.io";
          const loginOrigin = "https://www.nettlegroup.space";
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchWithRetry(url, init, attempts = 30) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const response = await fetch(url, init);
                if (response.ok || response.status === 401) return response;
                last = new Error("HTTP " + response.status + " from " + url);
              } catch (error) {
                last = error;
              }
              if (i + 1 < attempts) await pause(2500);
            }
            throw last;
          }

          const strategyPhrases = ["Международная карта", "Государственные программы", "Совет министров", "Вооружённые силы", "Карта мира с международными границами", "УКАЗ ПРЕЗИДЕНТА"];
          const gameAssetBase = "https://merekwi.github.io/presedento-sim/frontend/";

          async function fetchHtmlUntil(url, expected, label, attempts = 20) {
            let html = "";
            for (let attempt = 0; attempt < attempts; attempt++) {
              const response = await fetchWithRetry(url + (url.includes("?") ? "&" : "?") + "fresh=" + Date.now(), {
                headers: { "Cache-Control": "no-cache" },
              });
              html = await response.text();
              if (expected.every(marker => html.includes(marker))) return html;
              if (attempt + 1 < attempts) await pause(2500);
            }
            throw new Error(label + " did not finish publishing the expected callback changes.");
          }

          const gamePage = await fetchWithRetry("https://merekwi.github.io/presedento-sim/", { headers: { "Cache-Control": "no-cache" } });
          const gameHtml = await gamePage.text();
          if (!gamePage.ok || !gameHtml.toLowerCase().includes("<html")) {
            throw new Error("Presidential Simulator root page is not reachable as HTML.");
          }

          const sourceHtml = await readFile("frontend/index.html", "utf8");
          for (const marker of ["<title>Presidential Simulator</title>", "id=\"worldMap\"", "id=\"presidentPortrait\"", "Случайная страна. Случайный кандидат.", "Название политической партии", "Сложность симуляции"]) {
            if (!sourceHtml.includes(marker)) throw new Error("Committed frontend source is missing a required game/setup element: " + marker);
          }

          const sourceApp = await readFile("frontend/app.js", "utf8");
          for (const marker of ["function renderWorldMap", "./assets/portraits/", "data-election-proposal", "data-ai-diplomacy", "/api/presidential/ai/decree/draft", "/api/presidential/ai/election/action"]) {
            if (!sourceApp.includes(marker)) throw new Error("Committed frontend source is missing AI-powered political game logic: " + marker);
          }

          const publishedGameHtml = await fetchHtmlUntil(
            gameAssetBase,
            ["id=\"worldMap\"", "id=\"constitution\"", "closeDecreeTop"],
            "Published game frontend",
            30
          );

          const loginHtml = await fetchHtmlUntil(
            loginOrigin + "/presidential-login.html",
            ["Verify_NettleBOT", "https://merekwi.github.io/presedento-sim/"],
            "Telegram login page"
          );
          const preflight = await fetch(api + "/api/presidential/me", {
            method: "OPTIONS",
            headers: {
              Origin: gameOrigin,
              "Access-Control-Request-Method": "GET",
              "Access-Control-Request-Headers": "authorization,content-type",
            },
          });
          if (preflight.status !== 204) throw new Error("Game CORS preflight returned HTTP " + preflight.status);
          if (preflight.headers.get("access-control-allow-origin") !== gameOrigin) throw new Error("Wrong game CORS origin.");
          if (!(preflight.headers.get("access-control-allow-headers") || "").toLowerCase().includes("authorization")) throw new Error("Authorization header is not allowed by CORS.");

          const health = await fetch(api + "/api/presidential/health", { headers: { Origin: gameOrigin } });
          const healthData = await health.json();
          if (!health.ok || healthData.database !== true || Number(healthData.countryCount) < 20) {
            throw new Error("Presidential database health check failed: " + JSON.stringify(healthData));
          }

          const aiApi = "https://br-nameless-term-b9ex7292-presidaidev.compute.c-7.eu-central-1.aws.neon.tech";
          const aiHealthResponse = await fetch(aiApi + "/api/presidential/ai/health", { headers: { Origin: gameOrigin } });
          const aiHealth = await aiHealthResponse.json();
          if (!aiHealthResponse.ok || aiHealth.database !== true || Number(aiHealth.countryCount) < 20 ||
              Number(aiHealth.activeSaves) < 1 || aiHealth.aiConfigured !== true) {
            throw new Error("Presidential AI API health check failed: " + JSON.stringify(aiHealth));
          }
          if (aiHealthResponse.headers.get("access-control-allow-origin") !== gameOrigin) {
            throw new Error("Presidential AI API CORS origin is incorrect.");
          }

          const me = await fetch(api + "/api/presidential/me", { headers: { Origin: gameOrigin } });
          if (me.status !== 401) throw new Error("Unauthenticated /me should return 401, received " + me.status);
          if (me.headers.get("access-control-allow-origin") !== gameOrigin) throw new Error("Authenticated API route does not return game CORS headers.");

          const invalidTelegram = await fetch(api + "/api/presidential/auth/telegram", {
            method: "POST",
            headers: { Origin: loginOrigin, "Content-Type": "application/json" },
            body: JSON.stringify({
              id: "0",
              auth_date: Math.floor(Date.now() / 1000),
              hash: "0".repeat(64),
              state: Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString("base64url"),
            }),
          });
          if (invalidTelegram.status !== 401) throw new Error("Invalid Telegram signature must be rejected with 401, received " + invalidTelegram.status);

          const gameScript = await fetchWithRetry(gameAssetBase + "app.js?fresh=" + Date.now(), { headers: { "Cache-Control": "no-cache" } });
          const appJs = await gameScript.text();
          if (!gameScript.ok || !appJs.length) throw new Error("Published game JavaScript asset is unavailable.");
          const gameRoutes = [
            "/api/presidential/game/program",
            "/api/presidential/game/advance",
            "/api/presidential/game/minister",
            "/api/presidential/game/election/vote",
            "/api/presidential/game/constitution/propose",
            "/api/presidential/game/constitution/parliament",
            "/api/presidential/game/constitution/referendum",
            "/api/presidential/game/referendum/propose",
            "/api/presidential/game/referendum/hold",
            "/api/presidential/ai/decree/draft",
            "/api/presidential/ai/decree/publish",
            "/api/presidential/ai/election/decision",
            "/api/presidential/ai/election/action",
            "/api/presidential/ai/diplomacy/history?relationId=",
            "/api/presidential/ai/diplomacy/message"
          ];
          for (const route of gameRoutes) {
            if (!appJs.includes(route)) throw new Error("Frontend is not wired to route " + route);
          }

          const flagAsset = await fetchWithRetry(gameAssetBase + "assets/flags/BR.svg", { headers: { "Cache-Control": "no-cache" } });
          const portraitAsset = await fetchWithRetry(gameAssetBase + "assets/portraits/01.svg", { headers: { "Cache-Control": "no-cache" } });
          const worldMapAsset = await fetchWithRetry(gameAssetBase + "assets/world-countries.geojson?fresh=" + Date.now(), { headers: { "Cache-Control": "no-cache" } });
          const mapData = await worldMapAsset.json();
          if (!(await flagAsset.text()).includes("<svg") || !(await portraitAsset.text()).includes("<svg") || !Array.isArray(mapData.features) || mapData.features.length < 100) throw new Error("Local flag, portrait or world map asset is missing or invalid.");

          const protectedRoutes = [
            ["/api/presidential/game/program", { action: "start", projectId: "health_modernization" }],
            ["/api/presidential/game/advance", {}],
            ["/api/presidential/game/minister", { action: "appoint", name: "Smoke Test", portfolio: "Образование", age: 45, competence: 70, loyalty: 70, archetype: "technocrat", portraitId: "p01" }],
            ["/api/presidential/game/diplomacy", { action: "consultations", relationId: "00000000-0000-0000-0000-000000000000" }],
            ["/api/presidential/game/election/decision", { issueId: "budget", choiceId: "spending_review" }],
            ["/api/presidential/game/election/vote", {}],
            ["/api/presidential/game/constitution/propose", { articleId: "rights", proposedText: "Государство гарантирует дополнительные механизмы судебной защиты и равенство граждан перед законом.", reason: "Поправка расширяет гарантии судебной защиты и процессуальные права граждан." }],
            ["/api/presidential/game/constitution/parliament", {}],
            ["/api/presidential/game/constitution/referendum", {}],
            ["/api/presidential/game/referendum/propose", { topic: "social", question: "Следует ли расширить государственную программу доступной медицинской помощи?", yesLabel: "Поддержать программу", noLabel: "Отклонить программу" }],
            ["/api/presidential/game/referendum/hold", {}],
            ["/api/presidential/game/decree/draft", { order: "Модернизировать государственную систему здравоохранения." }],
            ["/api/presidential/game/decree/publish", { decreeId: "00000000-0000-0000-0000-000000000000" }]
          ];
          for (const [route, body] of protectedRoutes) {
            const response = await fetch(api + route, {
              method: "POST",
              headers: { Origin: gameOrigin, "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            if (response.status !== 401) throw new Error(route + " must require authentication (401), received " + response.status);
          }

          const protectedAiRoutes = [
            ["/api/presidential/ai/decree/draft", "POST", { order: "Подготовить проект закона о модернизации больниц." }],
            ["/api/presidential/ai/decree/publish", "POST", { decreeId: "00000000-0000-0000-0000-000000000000" }],
            ["/api/presidential/ai/election/decision", "POST", { proposal: "Увеличить доступность медицинской помощи в регионах." }],
            ["/api/presidential/ai/election/action", "POST", { action: "Выступить перед работниками промышленных регионов и обсудить задержки зарплат." }],
            ["/api/presidential/ai/diplomacy/message", "POST", { relationId: "00000000-0000-0000-0000-000000000000", message: "Предлагаю начать переговоры о торговом соглашении." }],
            ["/api/presidential/ai/diplomacy/history?relationId=00000000-0000-0000-0000-000000000000", "GET", null]
          ];
          for (const [route, method, body] of protectedAiRoutes) {
            const response = await fetch(aiApi + route, {
              method,
              headers: { Origin: gameOrigin, ...(body ? { "Content-Type": "application/json" } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            if (response.status !== 401) throw new Error("AI route " + route + " must require authentication (401), received " + response.status);
          }

          console.log("Passed: free-text election UI, AI decree and diplomacy routes, server authorization, randomized campaign setup, map and portrait assets, programmes, Telegram bridge, Neon health, CORS and signature rejection.");
          NODE
