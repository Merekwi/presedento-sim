name: Configure OpenRouter for presidential simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$NEON_API_KEY" || { echo "::error::Missing GitHub secret NEON_API_KEY"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing GitHub secret OPENROUTER_API_KEY"; exit 1; }

      - name: Verify Neon API key and project access
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error \
            --output /tmp/neon-auth-response.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/dry-shape-51006688")"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Neon API authentication/project access failed (HTTP $STATUS). Replace GitHub secret NEON_API_KEY with a fresh Neon personal API key that can access the nettlegroup project. Do not use an OpenRouter key or database password."
            if [ "$STATUS" = "403" ]; then
              echo "::error::The key was recognized but does not have permission to access this project."
            elif [ "$STATUS" = "401" ]; then
              echo "::error::Neon did not accept this API key. It may be incorrect, revoked, or not a Neon API key."
            fi
            exit 1
          fi
          echo "Neon API key accepted; project access confirmed."

      - name: Add OpenRouter key to existing Neon Function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          ENVIRONMENT="$(jq -cn --arg key "$OPENROUTER_API_KEY" '{OPENROUTER_API_KEY: $key}')"
          STATUS="$(curl --silent --show-error \
            --output /tmp/neon-deploy-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://console.neon.tech/api/v2/projects/dry-shape-51006688/branches/br-little-union-b9iipjfz/functions/nettleapi/deployments" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header "Accept: application/json" \
            --form-string "environment=$ENVIRONMENT")"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "202" ]; then
            echo "::error::Neon rejected the environment-only deployment (HTTP $STATUS)."
            jq -r '.message // .error // empty' /tmp/neon-deploy-response.json 2>/dev/null || true
            exit 1
          fi

          echo "Neon accepted the environment-only deployment request."
          if jq -e '.id' /tmp/neon-deploy-response.json >/dev/null 2>&1; then
            echo "Deployment ID: $(jq -r '.id' /tmp/neon-deploy-response.json)"
          fi
