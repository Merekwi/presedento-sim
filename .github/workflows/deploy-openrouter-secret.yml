name: Configure OpenRouter for presidential simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$NEON_API_KEY" || { echo "::error::Missing GitHub secret NEON_API_KEY"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing GitHub secret OPENROUTER_API_KEY"; exit 1; }

      - name: Add OpenRouter key to existing Neon Function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          ENVIRONMENT="$(jq -cn --arg key "$OPENROUTER_API_KEY" '{OPENROUTER_API_KEY: $key}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://console.neon.tech/api/v2/projects/dry-shape-51006688/branches/br-little-union-b9iipjfz/functions/nettleapi/deployments" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --form-string "environment=$ENVIRONMENT" \
            --output /tmp/neon-response.json
          echo "Neon accepted the environment-only deployment request."
          if jq -e '.id' /tmp/neon-response.json >/dev/null 2>&1; then
            echo "Deployment ID: $(jq -r '.id' /tmp/neon-response.json)"
          fi
