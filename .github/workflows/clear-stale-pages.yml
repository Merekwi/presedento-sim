name: Clear stale GitHub Pages deployments

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/clear-stale-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  pages: write
  deployments: write
  contents: read

concurrency:
  group: clear-stale-pages
  cancel-in-progress: true

jobs:
  clear-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect and cancel the abandoned Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deploymentId = "1cdec0d9082ef37e7ef8d4789b00b7f081477eb4";
            const status = await github.request(
              "GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}",
              { owner, repo, deploymentId }
            );
            core.info("Old Pages deployment status: " + JSON.stringify(status.data));
            if (["queued", "pending", "in_progress"].includes(status.data.status)) {
              const cancelled = await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel",
                { owner, repo, deploymentId }
              );
              core.info("Cancelled stale Pages deployment " + deploymentId);
              core.info(JSON.stringify(cancelled.data));
            } else {
              core.info("Old Pages deployment is not active; no cancellation required.");
            }
      - name: Let the Pages deployment queue settle
        run: sleep 8
