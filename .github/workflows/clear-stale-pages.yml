name: Clear stale GitHub Pages deployments

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/clear-stale-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  pages: write
  deployments: write
  contents: read

concurrency:
  group: clear-stale-pages
  cancel-in-progress: true

jobs:
  clear-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the abandoned Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deploymentId = "1cdec0d9082ef37e7ef8d4789b00b7f081477eb4";
            try {
              const response = await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel",
                { owner, repo, deploymentId }
              );
              core.info("Cancelled stale GitHub Pages deployment " + deploymentId);
              core.info(JSON.stringify(response.data));
            } catch (error) {
              if (error.status === 404 || error.status === 409) {
                core.warning("The stale Pages deployment is already gone or no longer cancellable: " + error.message);
              } else {
                throw error;
              }
            }
      - name: Let the Pages deployment queue settle
        run: sleep 8
