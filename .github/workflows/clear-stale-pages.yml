name: Clear stale GitHub Pages deployments

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/clear-stale-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

concurrency:
  group: clear-stale-pages
  cancel-in-progress: true

jobs:
  clear-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deactivate deployments left in progress by older commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const environment = "github-pages";
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment, per_page: 100
            });
            let deactivated = 0;
            for (const deployment of deployments) {
              if (deployment.sha === currentSha) continue;
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 10
              });
              const latest = statuses[0];
              if (!latest || !["in_progress", "queued", "pending"].includes(latest.state)) continue;
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: deployment.id,
                state: "inactive",
                description: "Closed stale Pages deployment from an older commit so the latest site can publish."
              });
              core.info("Deactivated stale Pages deployment " + deployment.id + " (" + deployment.sha + ")");
              deactivated++;
            }
            core.info("Stale Pages deployments deactivated: " + deactivated);
      - name: Let Pages deployment queue settle
        run: sleep 8
